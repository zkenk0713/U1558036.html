<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的圖片展示網站</title>
    <!-- 這裡修改成您的 CSS 檔名：U1558036.css -->
    <link rel="stylesheet" href="U1558036.css">
</head>
<body>

    <!-- 網站標題 -->
    <h1>精選圖片展示</h1>

    <!-- 圖片藝廊容器 -->
    <div class="gallery">
        
        <!-- 第 1 張圖片 -->
        <a href="https://www.google.com" target="_blank" class="card">
            <img src="https://picsum.photos/id/1015/400/600" alt="風景圖片 1">
        </a>

        <!-- 第 2 張圖片 -->
        <a href="https://www.youtube.com" target="_blank" class="card">
            <img src="https://picsum.photos/id/1016/400/600" alt="風景圖片 2">
        </a>

        <!-- 第 3 張圖片 -->
        <a href="https://www.apple.com" target="_blank" class="card">
            <img src="https://picsum.photos/id/1018/400/600" alt="風景圖片 3">
        </a>

        <!-- 第 4 張圖片 -->
        <a href="https://www.wikipedia.org" target="_blank" class="card">
            <img src="https://picsum.photos/id/1025/400/600" alt="風景圖片 4">
        </a>

        <!-- 第 5 張圖片 -->
        <a href="https://www.github.com" target="_blank" class="card">
            <img src="https://picsum.photos/id/1035/400/600" alt="風景圖片 5">
        </a>

    </div>

</body>
</html>
